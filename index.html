<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL TIRRI SLOT</title><link rel="stylesheet" href="style.css"></head>
<body><main class="machine"><header><span class="eyebrow">EL TIRRI</span><h1>SLOT</h1><span class="badge">MODO DEMO</span></header>
<section class="slot"><div class="reels" id="reels"></div><div class="payline"></div></section>
<section class="controls"><div class="stats"><span>CRÉDITOS<b id="credits">1000</b></span><span>APUESTA/LÍNEA<b id="bet">10</b></span><span>LÍNEAS<b id="lines">3</b></span><span>TOTAL<b id="total">30</b></span></div>
<div class="line-controls"><button data-line="-1">− LÍNEA</button><button data-line="1">+ LÍNEA</button></div><div class="bet-controls"><button id="betDown">− APUESTA</button><button id="betUp">+ APUESTA</button></div><button id="spin" class="spin">GIRAR</button><div class="message" id="message">¡Que empiece la suerte!</div></section>
<section class="paytable"><h2>TABLA DE PREMIOS</h2><div class="paygrid"><span>🍒 🍒 🍒 <b>×8</b></span><span>🍋 🍋 🍋 <b>×8</b></span><span>🍊 🍊 🍊 <b>×10</b></span><span>🔔 🔔 🔔 <b>×12</b></span><span>⭐ ⭐ ⭐ <b>×15</b></span><span>💎 💎 💎 <b>×25</b></span><span>7️⃣ 7️⃣ 7️⃣ <b>×50</b></span><span>2 IGUALES <b>×2</b></span></div></section>
</main><script src="game.js"></script><script src="script.js"></script></body></html>
