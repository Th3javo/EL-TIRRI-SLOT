<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EL TIRRI SLOT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="machine">
    <header><span class="eyebrow">EL TIRRI</span><h1>SLOT</h1></header>
    <section class="slot" aria-label="Máquina tragamonedas">
      <div class="reels" id="reels"></div>
      <div class="payline"></div>
    </section>
    <section class="controls">
      <div class="stats"><span>CRÉDITOS <b id="credits">1000</b></span><span>APUESTA <b id="bet">10</b></span></div>
      <div class="bets"><button data-bet="1">−</button><button data-bet="plus">+</button></div>
      <button id="spin" class="spin">GIRAR</button>
      <div class="message" id="message">¡Que empiece la suerte!</div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
