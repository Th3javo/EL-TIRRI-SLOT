<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL TIRRI SLOT</title><link rel="stylesheet" href="style.css"></head>
<body><main class="machine"><header><span class="eyebrow">EL TIRRI</span><h1>SLOT</h1></header>
<section class="slot"><div class="reels" id="reels"></div><div class="payline"></div></section>
<section class="controls"><div class="stats"><span>CRÉDITOS<b id="credits">1000</b></span><span>APUESTA<b id="bet">10</b></span><span>LÍNEAS<b id="lines">3</b></span></div>
<div class="line-controls"><button data-line="-1">− LÍNEA</button><button data-line="1">+ LÍNEA</button></div><button id="spin" class="spin">GIRAR</button><div class="message" id="message">¡Que empiece la suerte!</div></section>
<section class="paytable"><h2>TABLA DE PREMIOS</h2><div>7️⃣ 7️⃣ 7️⃣ <b>×50</b> · 💎 💎 💎 <b>×25</b> · 3 IGUALES <b>×10</b> · 2 IGUALES <b>×2</b></div></section>
</main><script src="script.js"></script></body></html>
